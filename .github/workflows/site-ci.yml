name: Site CI

on:
  pull_request:
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "tools/check_site_output.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      # The catalog is generated from skill frontmatter, which lives in the
      # skills repository rather than this site repository.
      - name: Checkout skills
        uses: actions/checkout@v6
        with:
          repository: rhiza-research/weather-skills
          ref: main
          path: _skills_repo
          sparse-checkout: skills
          sparse-checkout-cone-mode: true

      - name: Stage skills for the site build
        run: mv _skills_repo/skills skills && rm -rf _skills_repo

      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build site
        run: uv run --script tools/build_site.py --output _site
      - name: Validate site output
        run: uv run --script tools/check_site_output.py _site
